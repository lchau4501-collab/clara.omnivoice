#   https://huggingface.co/k2-fsa/OmniVoice
#   This workflow downloads the weights from Hugging Face at run time for
#   non-commercial personal experimentation. No weights are committed to or
#   redistributed by this repository.
# - Audio tokenizer (audio_tokenizer/): Boson Higgs Audio 2 Community License
#   (based on the Meta Llama 3 Community License).
#   "Built with Higgs Materials licensed from Boson AI USA, Inc., Copyright
