name: omnivoice-voice-design-samples

on:
  workflow_dispatch:

concurrency:
  group: omnivoice-voice-design-samples-${{ github.repository }}
  cancel-in-progress: false

jobs:
  voice-design:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          python -m pip install --upgrade pip
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice==0.2.1 safetensors soundfile huggingface_hub
          echo "TIMING dependency_install: $(( $(date +%s) - START ))s"

      - name: Generate two short self-designed voices
        env:
          HF_HOME: ${{ runner.temp }}/hf
          OV_REVISION: c5fdb5ccb189668d56333f77ba2629f4cd7535f4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import os, time, resource, shutil
          import torch
          import soundfile as sf

          t_start = time.perf_counter()
          t_prev = t_start
          def lap(name):
              global t_prev
              now = time.perf_counter()
              print(f"TIMING {name}: {now - t_prev:.1f}s", flush=True)
              t_prev = now

          print("torch", torch.__version__, flush=True)
          os.system("nproc; free -m | head -2")

          from huggingface_hub import snapshot_download
          snap = snapshot_download("k2-fsa/OmniVoice", revision=os.environ["OV_REVISION"])
          lap("snapshot_download")

          # Convert weights to fp16 tensor by tensor (keeps peak RSS low).
          from safetensors import safe_open
          from safetensors.torch import save_file
          work = os.path.join(os.environ["HF_HOME"], "ov-fp16")
          os.makedirs(work, exist_ok=True)
          for entry in os.listdir(snap):
              if entry == "model.safetensors":
                  continue
              src = os.path.join(snap, entry)
              dst = os.path.join(work, entry)
              if os.path.isdir(src):
                  if not os.path.exists(dst):
                      os.symlink(src, dst)
              else:
                  shutil.copy2(src, dst)
          tensors = {}
          with safe_open(os.path.join(snap, "model.safetensors"), framework="pt") as f:
              for k in f.keys():
                  t = f.get_tensor(k)
                  if t.is_floating_point():
                      t = t.to(torch.float16)
                  tensors[k] = t
          save_file(tensors, os.path.join(work, "model.safetensors"), metadata={"format": "pt"})
          del tensors
          lap("fp16_convert")

          torch.set_num_threads(2)
          torch.manual_seed(7)
          from omnivoice import OmniVoice
          model = OmniVoice.from_pretrained(work, device_map="cpu", dtype=torch.float16)
          lap("model_load")

          samples = [
              (
                  "sample1.wav",
                  "At dawn, the quiet harbor slowly came to life.",
                  "male, middle-aged, low pitch, american accent",
              ),
              (
                  "sample2.wav",
                  "A small change in direction can open a new path.",
                  "male, young adult, moderate pitch, american accent",
              ),
          ]
          with torch.inference_mode():
              for index, (filename, text, instruction) in enumerate(samples, start=1):
                  t_gen = time.perf_counter()
                  audio = model.generate(text=text, language="English", instruct=instruction)
                  elapsed = time.perf_counter() - t_gen
                  print(f"TIMING sample_{index}_gen: {elapsed:.1f}s", flush=True)
                  sf.write(filename, audio[0], model.sampling_rate)
                  print(
                      f"AUDIO {filename} duration: {len(audio[0]) / model.sampling_rate:.2f}s "
                      f"sample_rate: {model.sampling_rate} channels: 1",
                      flush=True,
                  )
          print(f"TIMING total_python: {time.perf_counter() - t_start:.1f}s", flush=True)
          print(f"RSS_PEAK_MB: {resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024:.0f}", flush=True)
          PYEOF

      - name: Upload audio artifact (auto-expire after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: omnivoice-voice-design-samples
          path: |
            sample1.wav
            sample2.wav
          retention-days: 1
